[package]
name = "engine-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The native app's side of the engine: the canvas, each module's state, save and load. Never on the audio thread."

[dependencies]
engine-core = { path = "../engine-core" }
engine-mgl = { path = "../engine-mgl" }
wave = { path = "../../core/crates/wave" }
serde_json = { version = "1", features = ["float_roundtrip"] }
# The Sound and Edit modules: MGL's own edit list, its file reading and an
# empty rack to measure through, as MGL's server uses them for /api/edit.
mgl-edit = { package = "edit", path = "../../core/crates/edit" }
mgl-fx = { package = "fx", path = "../../core/crates/fx" }
audio-core = { path = "../../core/crates/audio-core" }
# The Grain module: MGL's grain deck's own types (its sound, its keys, the
# layer bank, the Pitch Time Changer), as MGL's server hands them over.
mgl-engine = { package = "engine", path = "../../core/crates/engine", default-features = false }

[dev-dependencies]
# Atmosphere's synth driven by hand, to check the canvas module against it.
atmos = { path = "../../core/crates/atmos" }
