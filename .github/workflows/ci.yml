# Build it and run everything, on every push.
#
# One job. The browser tests drive the binary the Rust step just built — the
# interface is `include_str!`-embedded, so testing a second build would be
# testing a second interface — and handing a 30 MB binary between two jobs
# meant an upload, a download, a second checkout and a few hundred megabytes a
# day against the artifact quota, to run two things that were serial anyway.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Costs nothing until something fails, and when it fails on a machine you
  # cannot log into it is the whole difference.
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build and test
    # macOS, where the app is made and used. On Linux the suite measured the
    # runner more than the app: no AAC encoder in its Chromium, WebGL in
    # software, and the server going quiet through the prism tests (31 Oct
    # 2026: 54 failures, every one of which passes on the Mac).
    runs-on: macos-latest
    # The browser suite alone is past half an hour on a runner, which draws
    # WebGL in software; 30 cancelled it two thirds of the way through.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # prism-fx (rjvaleo/hyper-efx) is a path dependency at `../GitHub/prism-fx`
      # beside this checkout, the way the two sit on the Mac. The repository is
      # private, so its clone needs `PRISM_FX_TOKEN`, a token that can read it;
      # the workflow's own token is enough only if it is ever made public.
      # Checkout will not write outside the workspace, hence the move.
      - name: Check out prism-fx
        uses: actions/checkout@v4
        with:
          repository: rjvaleo/hyper-efx
          token: ${{ secrets.PRISM_FX_TOKEN || github.token }}
          path: prism-fx

      - name: Put prism-fx where the manifests look
        run: mkdir -p ../GitHub && mv prism-fx ../GitHub/prism-fx

      - uses: dtolnay/rust-toolchain@stable

      # 200 packages and a release profile. Without this every run is a cold
      # build, which is the difference between about three minutes and about
      # ten. Keyed on the lockfile, so it is only thrown away when a dependency
      # actually moves.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --manifest-path core/Cargo.toml

      - name: Rust tests
        run: cargo test --release --manifest-path core/Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The static check first: it reads the source for references that do not
      # resolve, and it is seconds against the browser suite's half-minute.
      - name: Check the interface's references
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # `playwright.config.mjs` starts `tools/scratch-server.mjs` itself, which
      # builds its own library and data directory in a temp dir and spawns the
      # binary above on a port of its own. Nothing here needs a real library.
      - name: Browser tests
        run: npx playwright test

      - name: Keep the report if it failed
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
