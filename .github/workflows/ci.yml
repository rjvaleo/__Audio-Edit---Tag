# Build it and run everything, on every push.
#
# Two jobs rather than one, because they fail for different reasons and it is
# worth knowing which. The Rust job is the whole workspace's tests; the
# interface job drives the real binary in a real browser and can only run once
# that binary exists.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A backtrace costs nothing until something fails, and when something fails on
  # a machine you cannot log into it is the whole difference.
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust — build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `engine` links cpal, which on Linux is ALSA. This is a build-time
      # dependency only — nothing under test opens a device, so the runner
      # having no sound card does not matter.
      - name: ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      # Ten crates and a release profile: without this every run is a cold
      # build. Keyed on the lockfile, so it is only rebuilt when a dependency
      # actually moves.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --manifest-path core/Cargo.toml

      - name: Test
        run: cargo test --release --manifest-path core/Cargo.toml

      # The interface is `include_str!`-embedded, so the binary the browser tests
      # drive is the one this job just built. Handed over rather than rebuilt.
      - name: Keep the binary
        uses: actions/upload-artifact@v4
        with:
          name: audiolab
          path: core/target/release/audiolab
          retention-days: 1

  interface:
    name: Interface — browser tests
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Take the binary from the Rust job
        uses: actions/download-artifact@v4
        with:
          name: audiolab
          path: core/target/release
      - run: chmod +x core/target/release/audiolab

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The static check first: it reads the source for references that do not
      # resolve, and it is seconds against the browser suite's half-minute.
      - name: Check the interface's references
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # `playwright.config.mjs` starts `tools/scratch-server.mjs` itself, which
      # makes its own library and its own data directory in a temp dir and
      # spawns the binary above on port 8791. Nothing here needs a real library.
      - name: Browser tests
        run: npx playwright test

      - name: Keep the report if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
