[package]
name = "engine-mgl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "MultiGrainLive's own instruments and effects, run inside the native engine."

[dependencies]
engine-core = { path = "../engine-core" }
# The shared effects and MGL's own crates, as they are (see engine-idmlab's
# Cargo.toml for how the folders beside this one are laid out). MGL's crates
# find prism-fx in `GitHub/prism-fx`, so this must name the same folder.
prism-fx = { path = "../../GitHub/prism-fx/crates/prism-fx" }
wave = { path = "../../MultiGrainLive/core/crates/wave" }
