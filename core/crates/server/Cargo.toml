[package]
name = "server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Local HTTP server: serves the UI, streams audio, runs scans."

[dependencies]
audio-core = { path = "../audio-core" }
edit = { path = "../edit" }
fx = { path = "../fx" }
engine = { path = "../engine" }
wave = { path = "../wave" }
# MIDI in for the Wave synth: CoreMIDI on the Mac. Opened lazily on a
# thread of its own (`midi.rs`).
midir = "0.11"
search = { path = "../search" }
yamnet = { path = "../yamnet" }
catalog = { path = "../catalog" }
indexer = { path = "../indexer" }
# getrusage, for the analytics sampler's CPU and memory readings.
libc = "0.2"
