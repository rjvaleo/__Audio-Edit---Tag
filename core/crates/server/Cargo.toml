[package]
name = "server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Local HTTP server: serves the UI, streams audio, runs scans."

[features]
# The interface read from `ui/` on disk instead of compiled in: for test and
# development builds, so an interface change rebuilds no Rust. The live build
# leaves it off. See `src/routes/assets.rs`.
ui-from-disk = []

[dependencies]
audio-core = { path = "../audio-core" }
edit = { path = "../edit" }
fx = { path = "../fx" }
engine = { path = "../engine" }
wave = { path = "../wave" }
# MIDI in for the Wave synth: CoreMIDI on the Mac. Opened lazily on a
# thread of its own (`midi.rs`).
midir = "0.11"
search = { path = "../search" }
yamnet = { path = "../yamnet" }
# Stems: what is in a song, read from its stems, and sounds cut from them.
songprint = { path = "../songprint" }
catalog = { path = "../catalog" }
indexer = { path = "../indexer" }
# getrusage, for the analytics sampler's CPU and memory readings.
libc = "0.2"
