[package]
name = "yamnet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "AudioSet sound labels from the audio itself, via YAMNet on tract."

[dependencies]
# Pure Rust, so `cargo build --target x86_64-pc-windows-gnu` still works with
# nothing installed beyond the mingw linker. That was the whole reason for
# choosing tract over onnxruntime, which would have needed a native library
# built for each target.
tract-onnx = "0.23.4"

[dev-dependencies]
audio-core = { path = "../audio-core" }
