[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Real-time audio engine: owns the output device and renders the grain stream block by block."

[dependencies]
prism-grain = { path = "../../../../GitHub/prism-fx/crates/prism-grain" }
fx = { path = "../fx" }
audio-core = { path = "../audio-core" }
wave = { path = "../wave" }
# The sound card. Only `device` and `input` use it.
cpal = { version = "0.18", optional = true }

[features]
default = ["device"]
# Open the output and input devices. Off for a host that brings its own.
device = ["dep:cpal"]

[target.'cfg(unix)'.dev-dependencies]
# Thread CPU time for the block-cost test (`tests/pv_cost.rs`).
libc = "0.2"
