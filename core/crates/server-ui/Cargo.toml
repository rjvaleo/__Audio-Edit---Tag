[package]
name = "server-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The interface the local server serves: embedded, or read from disk with ui-from-disk."

[features]
# The interface read from `ui/` on disk instead of compiled in: for test and
# development builds, so an interface change rebuilds no Rust. The live build
# leaves it off. See `src/lib.rs`.
ui-from-disk = []

[dependencies]
server-core = { path = "../server-core" }
