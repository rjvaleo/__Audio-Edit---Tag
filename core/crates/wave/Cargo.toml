[package]
name = "wave"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Wave page's wavetable synth: tables, voices, modulation. Pure DSP, no I/O."

[dependencies]
# For the FFT that resamples imported frames and builds the mip levels. It runs
# only off the audio thread; nothing in `Synth` calls it.
audio-core = { path = "../audio-core" }
# The master chain's chorus, delay, reverb and EQ: the shared effects the rack
# runs (see docs/SHARED-FX.md), allocated once with the synth.
prism-fx = { path = "../../../../GitHub/prism-fx/crates/prism-fx" }
