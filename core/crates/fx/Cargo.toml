[package]
name = "fx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Effect rack: EQ, compression, gain. Non-destructive, applied at render time."

[dependencies]
prism-grain = { path = "../../../../GitHub/prism-fx/crates/prism-grain" }
# For the FFT and window functions the phase vocoder needs. audio-core is the
# base layer and depends on nothing, so this cannot cycle.
audio-core = { path = "../audio-core" }
# The effects shared with idMLab (see docs/SHARED-FX.md). A path for now:
# prism-fx has no remote yet. It becomes a git dependency on a tag once it has
# one, because CI cannot see a sibling folder.
prism-fx = { path = "../../../../GitHub/prism-fx/crates/prism-fx" }
