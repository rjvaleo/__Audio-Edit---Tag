[workspace]
members = ["engine-core", "engine-capi"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

# Tests run the audio path a sample at a time, so keep them quick, and keep
# the overflow checks a debug build carries.
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
# The app links the engine as a static library: a panic has nowhere to unwind to.
panic = "abort"
