<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound map — graph mock-up</title>
<style>
:root{
  --bg:oklch(11% 0.012 250);--surface:oklch(14% 0.014 250);--well:oklch(9.5% 0.01 250);--sink:oklch(8% 0.012 250);
  --line:rgba(255,255,255,.07);--edge:rgba(255,255,255,.11);
  --text:oklch(95% 0.005 250);--dim:oklch(70% 0.01 250);--dimmer:oklch(58% 0.012 250);
  --accent:oklch(70% 0.16 230);--hit:#ff4b4b;
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--sink);color:var(--text);overflow:hidden;font-size:11px}
button{font:inherit;color:inherit}
.bar{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--line);white-space:nowrap}
.title{font-weight:600;font-size:12px;margin-right:2px}
.lbl{color:var(--dimmer);margin-left:4px}
.seg{display:flex;border:1px solid var(--edge);border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;color:var(--dim);padding:3px 8px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--text)}
.seg button.on{background:oklch(70% 0.16 230 / .2);color:var(--text)}
input[type=search]{background:var(--well);border:1px solid var(--edge);border-radius:4px;color:var(--text);font:inherit;padding:3px 7px;width:190px;outline:none}
input[type=search]:focus{border-color:var(--accent)}
.found{color:var(--hit);min-width:54px}
.status{margin-left:auto;color:var(--dimmer)}
#stage{position:absolute;top:30px;left:0;right:0;bottom:0}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.drag{cursor:grabbing}canvas.point{cursor:pointer}
.about{position:absolute;left:8px;top:7px;max-width:56%;color:var(--dim);line-height:1.45;pointer-events:none}
.about b{color:var(--text);font-weight:600}
.crumb{color:var(--accent);pointer-events:auto;cursor:pointer}
.legend{position:absolute;left:8px;bottom:7px;color:var(--dimmer);line-height:1.6;pointer-events:none}
.fams{display:flex;gap:9px;flex-wrap:wrap}
.fams span{display:inline-flex;align-items:center;gap:4px;color:var(--dim)}
.fams i{width:7px;height:7px;border-radius:50%;display:inline-block}
.card{position:absolute;right:8px;top:8px;width:252px;max-height:calc(100% - 16px);overflow:auto;background:oklch(13% 0.014 250 / .95);border:1px solid var(--edge);border-radius:6px;padding:8px 9px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.card.on{display:block}
.card h3{margin:0 0 1px;font-size:13px;font-weight:600;word-break:break-word}
.card .where{color:var(--dimmer);margin-bottom:6px}
.card .row{display:flex;gap:6px;margin:3px 0;align-items:baseline}
.card .row>span:first-child{color:var(--dimmer);width:58px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{background:rgba(255,255,255,.06);border-radius:3px;padding:0 5px;line-height:16px;cursor:pointer}
.chip:hover{background:oklch(70% 0.16 230 / .25)}
.btns{display:flex;gap:4px;margin:7px 0 4px}
.btns button{flex:1;background:var(--well);border:1px solid var(--edge);border-radius:4px;padding:3px 0;cursor:pointer}
.btns button:hover{border-color:var(--accent)}
.list{margin-top:4px;border-top:1px solid var(--line)}
.list div{display:flex;gap:6px;align-items:center;padding:2px 0;cursor:pointer;border-bottom:1px solid var(--line)}
.list div:hover{background:rgba(255,255,255,.04)}
.list i{width:6px;height:6px;border-radius:50%;flex:none}
.list .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .sub{color:var(--dimmer);font-size:10px}
.sec{color:var(--dimmer);margin-top:7px;text-transform:uppercase;font-size:9px;letter-spacing:.06em}
.tip{position:absolute;pointer-events:none;background:oklch(15% 0.014 250 / .96);border:1px solid var(--edge);border-radius:4px;padding:3px 6px;display:none;max-width:280px;line-height:1.4}
.tip .p{color:var(--good,#6fd08c)}
.tip .d{color:var(--dimmer)}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--accent);border-radius:4px;padding:4px 10px;display:none}
</style></head>
<body>
<div class="bar">
  <span class="title">Sound map</span>
  <div class="seg" id="views">
    <button data-v="dandelion" title="Each folder is a hub with its sounds fanned out (1)">1 Dandelions</button>
    <button data-v="stars" title="Hubs are what the sound was heard as; colour is family (2)">2 Star clusters</button>
    <button data-v="tags" title="Words and labels, linked by how often they go together (3)">3 Tag web</button>
  </div>
  <span class="lbl">Colour</span>
  <div class="seg" id="tints"><button data-t="plain">Plain</button><button data-t="family">Family</button></div>
  <input type="search" id="find" placeholder="Find a name, folder, label or word  ( / )">
  <span class="found" id="found"></span>
  <div class="seg"><button id="home" title="Back to the whole library (Esc)">Whole library</button></div>
  <span class="status" id="status"></span>
</div>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="about" id="about"></div>
  <div class="legend"><div class="fams" id="fams"></div><div>Scroll zoom · drag to pan · drag a node · hover plays · click a sound for its card · click a hub to focus · / find · 1 2 3 views · Esc back</div></div>
  <div class="card" id="card"></div>
  <div class="tip" id="tip"></div>
  <div class="toast" id="toast"></div>
</div>

// ------------------------------------------------------------------ basics
const FAM = {
  percussion:['Percussion','#f2a33a'], voice:['Voice','#ef6f8e'], instrument:['Instrument','#4fc3e8'],
  music:['Music','#a98bf0'], machine:['Machine','#9aa7b8'], nature:['Nature','#6fd08c'],
  other:['Other','#d9c38f'], unknown:['Not heard','#6c7480'],
};
const PLAIN = '#e8edf4', HIT = '#ff4b4b', ACCENT = 'oklch(70% 0.16 230)', BG = 'oklch(8% 0.012 250)';
const fcol = (f) => (FAM[f] || FAM.other)[1];
const N = LIB.length;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const secs = (s) => s < 1 ? `${Math.round(s * 1000)} ms` : s < 60 ? `${s.toFixed(s < 10 ? 2 : 1)} s` : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
LIB.forEach((s, i) => { s.i = i; s.text = [s.n, s.k, s.c, s.ki, ...s.h, ...s.w].join(' ').toLowerCase(); });

// Similarity: the same twelve measurements "find similar" uses.
const KNN = LIB.map(() => []);
(() => {
  const K = 6;
  for (let i = 0; i < N; i++) {
    const a = LIB[i].v; if (!a) continue;
    const best = [];
    for (let j = 0; j < N; j++) {
      if (j === i) continue;
      const b = LIB[j].v; if (!b) continue;
      let d = 0; for (let q = 0; q < 12; q++) { const e = a[q] - b[q]; d += e * e; }
      if (best.length < K || d < best[best.length - 1][1]) {
        best.push([j, d]); best.sort((x, y) => x[1] - y[1]); if (best.length > K) best.pop();
      }
    }
    KNN[i] = best;
  }
})();

const mkNode = (o) => Object.assign({ x: 0, y: 0, vx: 0, vy: 0, r: 2, charge: -10, members: [], deg: 0 }, o);
const majority = (idx) => { const c = {}; idx.forEach((i) => { c[LIB[i].f] = (c[LIB[i].f] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1])[0]?.[0] || 'unknown'; };
const seedRing = (nodes, R) => nodes.forEach((n, i) => { const a = i * 2.39996; const r = R * Math.sqrt((i + 0.5) / nodes.length); n.x = Math.cos(a) * r; n.y = Math.sin(a) * r; });

// ------------------------------------------------------------- view 1: dandelions
function fanSpec(n) {
  const s = 5.4, gap = 5.2, R0 = 13 + Math.sqrt(n) * 1.3;
  const span = Math.min(Math.PI * 1.3, 0.75 + n * 0.028);
  const rows = []; let left = n, r = R0;
  while (left > 0) { const cap = Math.max(1, Math.floor(span * r / s) + 1); const c = Math.min(cap, left); rows.push({ r, c }); left -= c; r += gap; }
  return { rows, span, outer: r };
}
function buildDandelion() {
  const colls = new Map(), packs = new Map(), hubOf = [];
  LIB.forEach((s, i) => {
    if (!colls.has(s.c)) colls.set(s.c, mkNode({ kind: 'coll', label: s.c, packs: [] }));
    const c = colls.get(s.c);
    let h = c;
    if (s.k !== s.c) {
      const key = s.c + '/' + s.k;
      if (!packs.has(key)) { const p = mkNode({ kind: 'hub', label: s.k, parent: c }); packs.set(key, p); c.packs.push(p); }
      h = packs.get(key);
    }
    h.members.push(i); hubOf[i] = h;
  });
  const hubs = [...colls.values(), ...packs.values()];
  const links = [];
  for (const h of hubs) {
    h.members.sort((a, b) => (LIB[a].f < LIB[b].f ? -1 : LIB[a].f > LIB[b].f ? 1 : LIB[a].s - LIB[b].s));
    h.fan = fanSpec(h.members.length);
    h.all = h.kind === 'coll' ? [...h.members, ...h.packs.flatMap((p) => p.members)] : h.members;
    h.r = h.kind === 'coll' ? 3.6 + Math.sqrt(h.all.length) * 0.26 : 2.2 + Math.sqrt(h.members.length) * 0.3;
    h.col = fcol(majority(h.all));
    h.coll = h.members.length ? h.fan.outer + 4 : h.r + 10;
    h.charge = -(40 + h.coll * 4);
  }
  for (const c of colls.values()) for (const p of c.packs) links.push({ a: c, b: p, kind: 'tree', dist: c.coll * 0.4 + p.coll + 14, str: 0.6 });
  // Fine cross-links: folders whose sounds are each other's nearest neighbours.
  const pair = new Map();
  LIB.forEach((s, i) => KNN[i].slice(0, 4).forEach(([j]) => {
    const a = hubOf[i], b = hubOf[j]; if (a === b) return;
    const [x, y] = hubs.indexOf(a) < hubs.indexOf(b) ? [a, b] : [b, a];
    const key = hubs.indexOf(x) + ':' + hubs.indexOf(y);
    pair.set(key, (pair.get(key) || { a: x, b: y, n: 0 })); pair.get(key).n++;
  }));
  const cands = [...pair.values()].map((p) => ({ ...p, w: p.n / Math.sqrt(p.a.members.length * p.b.members.length) }));
  const keep = new Set();
  for (const h of hubs) cands.filter((p) => p.a === h || p.b === h).sort((x, y) => y.w - x.w).slice(0, 2).forEach((p) => keep.add(p));
  const wmax = Math.max(...[...keep].map((p) => p.w));
  for (const p of keep) links.push({ a: p.a, b: p.b, kind: 'sim', w: p.w / wmax, n: p.n, dist: p.a.coll + p.b.coll + 30, str: 0.04 + 0.16 * p.w / wmax });
  const leaves = LIB.map((s, i) => mkNode({ kind: 'leaf', si: i, hub: hubOf[i], r: 1.2 + Math.min(1.1, Math.log1p(s.s) * 0.35) }));
  seedRing(hubs, 260);
  return {
    nodes: [...hubs, ...leaves], sim: hubs, links, leaves, hubOf: (i) => hubOf[i], centre: 0.06, collide: true,
    about: '<b>Dandelions</b> — every folder is a hub and its sounds fan out from it; collections (bright, ringed) hold their folders. Fine lines join folders whose sounds are each other’s nearest match; thicker means more alike.',
    tint: 'plain',
    place() {
      let cx = 0, cy = 0; hubs.forEach((h) => { cx += h.x; cy += h.y; }); cx /= hubs.length; cy /= hubs.length;
      for (const h of hubs) {
        if (!h.members.length) continue;
        let ax, ay;
        const nb = h.kind === 'hub' ? [h.parent] : h.packs;
        if (nb.length) { ax = nb.reduce((t, n) => t + n.x, 0) / nb.length; ay = nb.reduce((t, n) => t + n.y, 0) / nb.length; } else { ax = cx; ay = cy; }
        let dir = Math.atan2(h.y - ay, h.x - ax); if (!isFinite(dir) || (h.x === ax && h.y === ay)) dir = -Math.PI / 2;
        let m = 0;
        h.fan.rows.forEach((row, ri) => {
          for (let q = 0; q < row.c; q++, m++) {
            const t = row.c === 1 ? 0.5 : q / (row.c - 1);
            const a = dir + (t - 0.5) * h.fan.span * (row.c === 1 ? 0 : 1) + (ri % 2 ? 0.5 : 0) * (h.fan.span / Math.max(2, row.c)) * 0 ;
            const L = leaves[h.members[m]]; L.x = h.x + Math.cos(a) * row.r; L.y = h.y + Math.sin(a) * row.r;
          }
        });
      }
    },
  };
}

// ---------------------------------------------------------- view 2: star clusters
function buildStars() {
  const cnt = {}; LIB.forEach((s) => { const l = s.h[0]; if (l) cnt[l] = (cnt[l] || 0) + 1; });
  const keyOf = (s) => (!s.h.length ? 'Not heard' : cnt[s.h[0]] >= 6 ? s.h[0] : `More ${FAM[s.f][0].toLowerCase()}`);
  const hubs = new Map(), hubOf = [];
  LIB.forEach((s, i) => { const k = keyOf(s); if (!hubs.has(k)) hubs.set(k, mkNode({ kind: 'hub', label: k })); hubs.get(k).members.push(i); hubOf[i] = hubs.get(k); });
  const H = [...hubs.values()];
  H.forEach((h) => { h.all = h.members; h.fam = majority(h.members); h.col = fcol(h.fam); h.r = 3 + Math.sqrt(h.members.length) * 0.62; h.charge = -(80 + h.members.length * 5); h.coll = h.r + 4; });
  const leaves = LIB.map((s, i) => mkNode({ kind: 'leaf', si: i, hub: hubOf[i], r: 1.4 + Math.min(1.3, Math.log1p(s.s) * 0.4), charge: -7 }));
  const links = leaves.map((L) => ({ a: L.hub, b: L, kind: 'spoke', dist: L.hub.r + 9 + Math.random() * 16 + Math.sqrt(L.hub.members.length) * 1.4, str: 0.75 }));
  const pair = new Map(); const cross = [];
  LIB.forEach((s, i) => {
    const near = KNN[i].find(([j]) => hubOf[j] !== hubOf[i]);
    if (near && near[1] < 0.12) cross.push({ a: leaves[i], b: leaves[near[0]], kind: 'cross' });
    KNN[i].slice(0, 4).forEach(([j]) => { const a = hubOf[i], b = hubOf[j]; if (a === b) return; const k = [H.indexOf(a), H.indexOf(b)].sort().join(':'); const p = pair.get(k) || { a, b, n: 0 }; p.n++; pair.set(k, p); });
  });
  const keep = new Set(); H.forEach((h) => [...pair.values()].filter((p) => p.a === h || p.b === h).sort((x, y) => y.n - x.n).slice(0, 2).forEach((p) => keep.add(p)));
  for (const p of keep) links.push({ a: p.a, b: p.b, kind: 'hubsim', dist: 150, str: 0.015, hidden: true });
  seedRing(H, 300);
  leaves.forEach((L) => { L.x = L.hub.x + (Math.random() - 0.5) * 30; L.y = L.hub.y + (Math.random() - 0.5) * 30; });
  return {
    nodes: [...H, ...leaves], sim: [...H, ...leaves], links, cross, leaves, hubOf: (i) => hubOf[i], centre: 0.05, collide: false, leafCut: 55,
    about: '<b>Star clusters</b> — each glowing hub is what the sounds were heard as (Percussion, Speech, Drum machine…); its sounds orbit it, coloured by family. Faint lines cross between clusters where a sound’s closest match lives elsewhere.',
    tint: 'family',
  };
}

// ---------------------------------------------------------------- view 3: tag web
const expanded = new Set();
function buildTags(prev) {

  $('card').innerHTML = `
    <h3>${esc(s.n)}</h3>
    <div class="where">${esc(s.k)}${s.k !== s.c ? ' › ' + esc(s.c) : ''}</div>
    <div class="row"><span>Family</span><span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${fcol(s.f)}"></i> ${FAM[s.f][0]}</span></div>
    <div class="row"><span>Heard as</span><div class="chips">${s.h.map((h) => `<span class="chip">${esc(h)}</span>`).join('') || '<span class="sub">—</span>'}</div></div>
    <div class="row"><span>Sounds</span><div class="chips">${s.w.map((h) => `<span class="chip">${esc(h)}</span>`).join('') || '—'}</div></div>
    <div class="row"><span>Length</span><span>${secs(s.s)}${s.nt ? ` · note ${s.nt}` : ''} · ${esc(s.ki)}</span></div>
    <div class="btns"><button data-msg="In the app: opens it in Edit">Edit</button><button data-msg="In the app: loads it into Grain">Grain</button><button data-msg="In the app: plays it through the engine">▶ Play</button></div>
    <div class="sec">Most alike</div>${sim.length ? rowList(sim) : '<div class="sub">Not measured yet</div>'}`;
  $('card').classList.add('on'); wireCard();
}
function showGroup(n) {
  if (!n) return;
  const idx = [...n.all].sort((a, b) => LIB[a].n.localeCompare(LIB[b].n));
  const fams = {}; idx.forEach((i) => { fams[LIB[i].f] = (fams[LIB[i].f] || 0) + 1; });
  $('card').innerHTML = `<h3>${esc(n.label)}</h3>
    <div class="where">${n.kind === 'coll' ? 'Collection' : n.kind === 'hub' ? (view === 'dandelion' ? 'Folder in ' + esc(n.parent.label) : 'Heard as') : n.kind === 'word' ? 'How it sounds' : 'Heard as'} · ${idx.length} sounds</div>
    <div class="chips">${Object.entries(fams).sort((a, b) => b[1] - a[1]).map(([f, c]) => `<span class="chip" style="cursor:default"><i style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${fcol(f)}"></i> ${FAM[f][0]} ${c}</span>`).join('')}</div>
    <div class="sec">Sounds</div>${rowList(idx)}`;
  $('card').classList.add('on'); wireCard();
  $('card').querySelectorAll('.chip').forEach((ch) => { ch.onclick = null; });
}
function gotoSound(i) {
  let L = leafOf(i);
  if (!L && view === 'tags') { const t = G.nodes.find((n) => n.kind === 'tag' && LIB[i].h.includes(n.label)) || G.nodes.find((n) => n.members?.includes(i) && n.kind !== 'leaf'); if (t) { expanded.add(t.key); G = buildTags(G); alpha = Math.max(alpha, .45); L = leafOf(i); } }
  if (!L) return;
  if (focus && !inFocus(L)) focus = null, crumb();
  selected = L; showSound(i); flyTo(L, 3.2); userMoved = true;
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { t.style.display = 'none'; }, 1600); }

// ---------------------------------------------------------------------- find
function setFind(q) {
  q = q.trim().toLowerCase(); hitsQ = q;
  if (!q) { hits = null; $('found').textContent = ''; return; }
  hits = new Set(LIB.filter((s) => s.text.includes(q)).map((s) => s.i));
  $('found').textContent = `${hits.size} found`;
}
$('find').addEventListener('input', (e) => setFind(e.target.value));
$('find').addEventListener('keydown', (e) => {
  e.stopPropagation();
  if (e.key === 'Enter' && hits && hits.size) { gotoSound([...hits][0]); }
  if (e.key === 'Escape') { e.target.value = ''; setFind(''); e.target.blur(); }
});

// --------------------------------------------------------------------- views
function setView(v) {
  view = v; focus = null; selected = null; hover = null; hideCard();
  if (v !== 'tags') expanded.clear();
  G = v === 'dandelion' ? buildDandelion() : v === 'stars' ? buildStars() : buildTags();
  setTint(G.tint);
  alpha = 1; userMoved = false;
  for (let i = 0; i < 60; i++) tick();
  fitTo(G.nodes, false);
  document.querySelectorAll('#views button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  crumb();
}
function setTint(t) {
  tint = t;
  document.querySelectorAll('#tints button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  $('fams').style.visibility = t === 'family' || view !== 'dandelion' ? 'visible' : 'hidden';
}
document.querySelectorAll('#views button').forEach((b) => { b.onclick = () => setView(b.dataset.v); });
document.querySelectorAll('#tints button').forEach((b) => { b.onclick = () => setTint(b.dataset.t); });
$('home').onclick = home;
window.addEventListener('keydown', (e) => {
  if (e.target === $('find')) return;
  if (e.key === '/') { $('find').focus(); e.preventDefault(); }
  else if (e.key === 'Escape') { if (hits) { $('find').value = ''; setFind(''); } else if (selected) { selected = null; hideCard(); } else home(); }
  else if (e.key === '1') setView('dandelion'); else if (e.key === '2') setView('stars'); else if (e.key === '3') setView('tags');
  else if (e.key === 'Home') home();
});

// legend + status
(() => {
  const c = {}; LIB.forEach((s) => { c[s.f] = (c[s.f] || 0) + 1; });
  $('fams').innerHTML = Object.entries(FAM).filter(([k]) => c[k]).map(([k, [nm, hx]]) => `<span><i style="background:${hx}"></i>${nm} ${c[k]}</span>`).join('');
  const colls = new Set(LIB.map((s) => s.c)).size, folders = new Set(LIB.map((s) => s.c + '/' + s.k)).size;
  $('status').textContent = `${N} sounds · ${folders} folders · ${colls} collections — mock-up on your library`;
})();

// ----------------------------------------------------------------------- loop
function frame(now) {
  if (alpha > 0.004) { tick(); if (view !== 'stars') tick(); }
  if (!userMoved && !focus && !fly) fitTo(G.nodes, false);
  if (fly) {
    const t = Math.min(1, (now - fly.t0) / fly.ms), e = t * t * (3 - 2 * t);
    const lk = Math.log(fly.from.k) + (Math.log(fly.to.k) - Math.log(fly.from.k)) * e;
    cam = { x: fly.from.x + (fly.to.x - fly.from.x) * e, y: fly.from.y + (fly.to.y - fly.from.y) * e, k: Math.exp(lk) };
    if (t >= 1) fly = null;
  }
  if (hover && hover.kind === 'leaf' && !auditioned && now - auditionAt > 140) {
    auditioned = hover; const p = document.getElementById('tipPlay'); if (p) p.textContent = '▶ playing (in the app; the mock-up is silent)';
  }
  draw(now);
  requestAnimationFrame(frame);
}
resize(); window.addEventListener('resize', () => { resize(); if (!userMoved && !focus) fitTo(G.nodes, false); });
setView('dandelion');
requestAnimationFrame(frame);
</script>
</body></html>
