<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound map — every dot a sound</title>
<style>
:root{--surface:oklch(14% 0.014 250);--well:oklch(9.5% 0.01 250);--line:rgba(255,255,255,.08);
--text:oklch(95% 0.005 250);--dim:oklch(70% 0.01 250);--dimmer:oklch(58% 0.012 250);--accent:oklch(70% 0.16 230);--hit:#ff4b4b;--good:#6fd08c;
font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#090b0f;color:var(--text);overflow:hidden;font-size:11px}
.bar{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--line);white-space:nowrap}
.title{font-weight:600;font-size:12px}.lbl{color:var(--dimmer);margin-left:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;color:var(--dim);font:inherit;padding:3px 8px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}.seg button:hover{color:var(--text)}
.seg button.on{background:oklch(70% 0.16 230 / .2);color:var(--text)}
input[type=search]{background:var(--well);border:1px solid var(--line);border-radius:4px;color:var(--text);font:inherit;padding:3px 7px;width:190px;outline:none}
input[type=search]:focus{border-color:var(--accent)}
.found{color:var(--hit);min-width:54px}.status{margin-left:auto;color:var(--dimmer)}
#stage{position:absolute;top:30px;left:0;right:0;bottom:0}
canvas{display:block;width:100%;height:100%;cursor:crosshair}canvas.drag{cursor:grabbing}
.now{position:absolute;left:8px;top:7px;color:var(--dim);pointer-events:none;line-height:1.5;font-size:12px}
.now b{color:var(--text)}.now .p{color:var(--good)}
.legend{position:absolute;left:8px;bottom:7px;color:var(--dimmer);line-height:1.7;pointer-events:none}
.keys{display:flex;gap:9px;flex-wrap:wrap}.keys span{display:inline-flex;align-items:center;gap:4px;color:var(--dim)}
.keys i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ramp{display:inline-block;width:120px;height:8px;border-radius:4px;vertical-align:middle;margin:0 4px}
.card{position:absolute;right:8px;top:8px;width:252px;max-height:calc(100% - 16px);overflow:auto;background:oklch(13% 0.014 250 / .95);border:1px solid var(--line);border-radius:6px;padding:8px 9px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.card.on{display:block}.card h3{margin:0 0 1px;font-size:13px;font-weight:600;word-break:break-word}
.where{color:var(--dimmer);margin-bottom:6px}.row{display:flex;gap:6px;margin:3px 0;align-items:baseline}
.row>span:first-child{color:var(--dimmer);width:56px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:3px}.chip{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:3px;padding:0 5px;line-height:16px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.sec{color:var(--dimmer);margin-top:7px;text-transform:uppercase;font-size:9px;letter-spacing:.06em}
.list{margin-top:3px;border-top:1px solid var(--line)}
.list div{display:flex;gap:6px;align-items:center;padding:2px 0;cursor:pointer;border-bottom:1px solid var(--line)}
.list div:hover{background:rgba(255,255,255,.04)}.list i{width:6px;height:6px;border-radius:50%;flex:none}
.list .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{color:var(--dimmer);font-size:10px}
.forming{position:absolute;right:10px;bottom:8px;color:var(--dimmer)}
</style></head><body>
<div class="bar">
  <span class="title">Sound map</span>
  <span class="lbl">Layout</span>
  <div class="seg" id="lay">
    <button data-l="alike" title="One map: sounds that sound alike sit together (1)">1 Sound-alike</button>
    <button data-l="islands" title="An island per family, each arranged by sound inside (2)">2 Family islands</button>
  </div>
  <span class="lbl">Colour</span>
  <div class="seg" id="tint">
    <button data-t="family">Family</button><button data-t="tone">Dark → bright</button><button data-t="len">Short → long</button>
  </div>
  <input type="search" id="find" placeholder="Find a sound, label or word  ( / )">
  <span class="found" id="found"></span>
  <span class="lbl">Hover plays</span>
  <div class="seg" id="playMode"><button data-p="on" class="on">On</button><button data-p="off">Off</button></div>
  <span class="status" id="status"></span>
</div>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="now" id="now"></div>
  <div class="legend"><div class="keys" id="keys"></div>
    <div>Every dot is one sound file · size = length · ring = it loops · names float over where a kind of sound gathers</div>
    <div>Move across the dots to hear them · click one to keep it and see the sounds most like it · scroll zoom · drag to pan · space stop · / find · Esc</div></div>
  <div class="card" id="card"></div>
  <div class="forming" id="forming"></div>
</div>

}

// ------------------------------------------------------------ the layout
let layout = 'alike', tint = 'family', dots = [], jobs = [], frame0 = 0;
const measured = LIB.filter((s) => s.x).map((s) => s.i), unmeasured = LIB.filter((s) => !s.x).map((s) => s.i);
function build() {
  dots = LIB.map((s, i) => ({ si: i, x: 0, y: 0, tx: 0, ty: 0, r: s.r }));
  jobs = [];
  if (layout === 'alike') jobs.push({ idx: measured, t: makeTsne(measured, 7), cx: 0, cy: 0, R: 420 });
  else {
    // An island per family: biggest in the middle, the rest round it, each sized by its count.
    const fam = {}; measured.forEach((i) => { (fam[LIB[i].f] = fam[LIB[i].f] || []).push(i); });
    const list = Object.entries(fam).sort((a, b) => b[1].length - a[1].length);
    let ang = 0; list.forEach(([f, idx], k) => { const R = 30 + Math.sqrt(idx.length) * 11;
      const ring = k === 0 ? 0 : 330 + (k % 2) * 40; const cx = Math.cos(ang) * ring, cy = Math.sin(ang) * ring * 0.8; if (k) ang += 2 * Math.PI / (list.length - 1);
      jobs.push({ idx, t: makeTsne(idx, 11 + k), cx, cy, R, label: FAM[f][0], fam: f }); });
  }
  // Unmeasured sounds wait in rows under the map, still playable.
  const cols = 60; unmeasured.forEach((i, u) => { dots[i].tx = -cols * 4.5 + (u % cols) * 9; dots[i].ty = 520 + Math.floor(u / cols) * 9; dots[i].x = dots[i].tx; dots[i].y = dots[i].ty; dots[i].wait = true; });
  place(true); userMoved = false;
}
/// From t-SNE's coordinates to the screen's world: scaled into each job's disc,

function place(snap) {
  for (const j of jobs) { const { Y, n } = j.t; let mx = 0, my = 0; for (let i = 0; i < n; i++) { mx += Y[2*i]; my += Y[2*i+1]; } mx /= n; my /= n;
    let R = 0; for (let i = 0; i < n; i++) R = Math.max(R, Math.hypot(Y[2*i] - mx, Y[2*i+1] - my)); R = R || 1;
    j.idx.forEach((si, i) => { const d = dots[si]; d.tx = j.cx + (Y[2*i] - mx) / R * j.R; d.ty = j.cy + (Y[2*i+1] - my) / R * j.R; if (snap) { d.x = d.tx; d.y = d.ty; } }); }
}
function relax() {
  for (const d of dots) { d.x += (d.tx - d.x) * 0.25; d.y += (d.ty - d.y) * 0.25; }
  const C = 14, grid = new Map(), key = (x, y) => x * 73856093 ^ y * 19349663;
  for (const d of dots) { const k = key(Math.floor(d.x / C), Math.floor(d.y / C)); let c = grid.get(k); if (!c) grid.set(k, c = []); c.push(d); }
  for (const d of dots) { const gx = Math.floor(d.x / C), gy = Math.floor(d.y / C);
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) { const c = grid.get(key(gx + ox, gy + oy)); if (!c) continue;
      for (const e of c) { if (e.si <= d.si) continue; const dx = e.x - d.x, dy = e.y - d.y, dd = Math.hypot(dx, dy) || 0.01, m = d.r + e.r + 1.3;
        if (dd < m) { const p = (m - dd) / dd * 0.5; d.x -= dx * p; d.y -= dy * p; e.x += dx * p; e.y += dy * p; } } } }
}

// ------------------------------------------------------------------ camera
const cv = $('cv'), g = cv.getContext('2d'); let VW = 0, VH = 0, DPR = 1, cam = { x: 0, y: 0, k: 1 }, fly = null, userMoved = false;
function resize() { DPR = devicePixelRatio || 1; const r = cv.getBoundingClientRect(); VW = r.width; VH = r.height; cv.width = VW * DPR; cv.height = VH * DPR; }
const toW = (sx, sy) => [(sx - VW / 2) / cam.k + cam.x, (sy - VH / 2) / cam.k + cam.y], toS = (x, y) => [(x - cam.x) * cam.k + VW / 2, (y - cam.y) * cam.k + VH / 2];
function fit() { if (VW < 50) return; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const d of dots) { x0 = Math.min(x0, d.x - d.r); y0 = Math.min(y0, d.y - d.r); x1 = Math.max(x1, d.x + d.r); y1 = Math.max(y1, d.y + d.r); }
  const right = $('card').classList.contains('on') ? 270 : 0, k = Math.min(6, (VW - 60 - right) / (x1 - x0 || 1), (VH - 110) / (y1 - y0 || 1));
  cam = { x: (x0 + x1) / 2 + right / 2 / k, y: (y0 + y1) / 2 + 8 / k, k }; }

// ------------------------------------------------------------------- sound
let playOn = true, playing = -1, wantT = 0, hover = null, selected = null, hits = null, trail = [];
const post = (url, body) => fetch(SERVER + url, { method: 'POST', mode: 'no-cors', body: body || '{}' }).catch(() => {});
async function play(i) {
  if (!playOn) return; playing = i; trail.push({ i, t: performance.now() }); if (trail.length > 16) trail.shift(); showNow();
  await post(`/api/engine/load?p=${encodeURIComponent(LIB[i].p)}&raw=1`);
  if (playing !== i) return; await post('/api/engine/transport', JSON.stringify({ seek: 0, play: true }));
}
function stop() { playing = -1; post('/api/engine/transport', JSON.stringify({ play: false })); showNow(); }
function showNow() { const d = hover || selected; if (!d) { $('now').innerHTML = ''; return; } const s = LIB[d.si];
  $('now').innerHTML = `<b>${esc(s.n)}</b> · ${secs(s.s)}${s.h[0] ? ' · ' + esc(s.h[0]) : ''}${s.w.length ? ' · <span style="color:var(--dimmer)">' + esc(s.w.slice(0, 4).join(', ')) + '</span>' : ''}` +
    (playing === d.si ? ' &nbsp;<span class="p">▶ playing</span>' : ''); }

// -------------------------------------------------------------------- draw
const colourOf = (s) => tint === 'tone' ? s.cTone : tint === 'len' ? s.cLen : s.cFam;
function draw(now) {
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.fillStyle = '#090b0f'; g.fillRect(0, 0, VW, VH);
  const k = cam.k; g.setTransform(DPR * k, 0, 0, DPR * k, DPR * (VW / 2 - cam.x * k), DPR * (VH / 2 - cam.y * k));
  const f = hover || selected, near = new Set(); if (f) { near.add(f.si); KNN[f.si].slice(0, 6).forEach(([j]) => near.add(j)); }
  // the trail of what you just heard
  g.lineCap = 'round';
  for (let q = 1; q < trail.length; q++) { const age = (now - trail[q].t) / 5000; if (age > 1) continue; const a = dots[trail[q-1].i], b = dots[trail[q].i];
    g.strokeStyle = `rgba(111,208,140,${(0.55 * (1 - age)).toFixed(3)})`; g.lineWidth = 1.3 / k; g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); }
  if (f) { const a = dots[f.si]; KNN[f.si].slice(0, 6).forEach(([j], q) => { const b = dots[j]; g.strokeStyle = 'rgba(130,195,255,0.7)'; g.lineWidth = (2 - q * 0.22) / k; g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); }); }
  for (const d of dots) { const s = LIB[d.si], hit = hits && hits.has(d.si); let a = 1;
    if (hits && !hit) a = 0.16; else if (f && !near.has(d.si)) a = 0.6; if (d.wait && !hit) a *= 0.7;
    const c = hit ? '#ff4b4b' : colourOf(s);
    if (hit) { g.globalAlpha = 0.25; g.fillStyle = '#ff4b4b'; g.beginPath(); g.arc(d.x, d.y, d.r * 1.9, 0, 7); g.fill(); }
    g.globalAlpha = a; g.fillStyle = c; g.beginPath(); g.arc(d.x, d.y, d.r, 0, 7); g.fill();
    if (s.loop) { g.strokeStyle = c; g.lineWidth = 0.6 + 0.6 / k; g.beginPath(); g.arc(d.x, d.y, d.r + 1.5, 0, 7); g.stroke(); } }

  if (playing >= 0) { const d = dots[playing], t = (now % 800) / 800; g.strokeStyle = `rgba(111,208,140,${(1 - t).toFixed(3)})`; g.lineWidth = 1.6 / k; g.beginPath(); g.arc(d.x, d.y, d.r + 2 + t * 14 / k, 0, 7); g.stroke(); }
  if (selected) { g.strokeStyle = '#fff'; g.lineWidth = 1.5 / k; g.beginPath(); g.arc(selected.x, selected.y, selected.r + 1 + 2.5 / k, 0, 7); g.stroke(); }
  labels();
}
function labels() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.textBaseline = 'middle';
  const taken = [], free = (x, y, w, h) => { for (const p of taken) if (x < p[0] + p[2] && x + w > p[0] && y < p[1] + p[3] && y + h > p[1]) return false; taken.push([x, y, w, h]); return true; };
  const f = hover || selected;
  const say = (d, txt, font, col, force) => { const [sx, sy] = toS(d.x, d.y); if (sx < -40 || sy < -10 || sx > VW + 40 || sy > VH + 10) return; g.font = font; g.textAlign = 'left';
    const w = g.measureText(txt).width, x = sx + d.r * cam.k + 4; if (!free(x, sy - 6, w, 12) && !force) return;
    g.fillStyle = 'rgba(0,0,0,0.65)'; g.fillText(txt, x + .6, sy + .8); g.fillStyle = col; g.fillText(txt, x, sy); };
  if (f) { say(f, LIB[f.si].n, '600 11px Inter, sans-serif', '#fff', true); KNN[f.si].slice(0, 6).forEach(([j]) => say(dots[j], LIB[j].n, '10px Inter, sans-serif', 'rgba(150,200,255,0.95)')); }
  // Where a kind of sound gathers, its name floats over it — a name, not a dot.
  g.textAlign = 'center';
  if (layout === 'islands') for (const j of jobs) { const [sx, sy] = toS(j.cx, j.cy - j.R - 14); g.font = '600 13px Inter, sans-serif'; const w = g.measureText(j.label).width;
    if (free(sx - w / 2, sy - 8, w, 16)) { g.fillStyle = FAM[j.fam][1]; g.fillText(`${j.label}  ${j.idx.length}`, sx, sy); } }
  const groups = {}; measured.forEach((i) => { const l = LIB[i].h[0]; if (l) (groups[l] = groups[l] || []).push(i); });
  const names = [];
  for (const [lab, m] of Object.entries(groups)) { if (m.length < 5) continue;
    // the label's tightest clump: the sounds of it with most of its own kind close by
    let best = null; for (const i of m) { let c = 0, sx = 0, sy = 0; for (const j of m) if (Math.hypot(dots[j].x - dots[i].x, dots[j].y - dots[i].y) < 45) { c++; sx += dots[j].x; sy += dots[j].y; }
      if (!best || c > best.c) best = { c, x: sx / c, y: sy / c }; }
    if (best.c >= Math.max(4, m.length * 0.3)) names.push({ lab, ...best }); }
  names.sort((a, b) => b.c - a.c);
  for (const t of names) { const [sx, sy] = toS(t.x, t.y); const size = Math.min(15, 10 + Math.sqrt(t.c) * 0.6); g.font = `600 ${size}px Inter, sans-serif`;
    const w = g.measureText(t.lab).width; if (!free(sx - w / 2 - 2, sy - size / 2, w + 4, size)) continue;
    g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillText(t.lab, sx + 1, sy + 1); g.fillStyle = 'rgba(240,244,250,0.9)'; g.fillText(t.lab, sx, sy); }
  if (unmeasured.length) { const [sx, sy] = toS(0, 505); g.font = '600 11px Inter, sans-serif'; g.fillStyle = 'rgba(200,210,225,0.65)'; g.fillText(`Not measured yet — ${unmeasured.length} sounds, still playable`, sx, sy); }
  g.textAlign = 'left';
  if (cam.k >= 2.4 || hits) { let b = 260; for (const d of dots) { if (!b) break; const hit = hits && hits.has(d.si); if (cam.k < 2.4 && !hit) continue; if (d === f) continue;
    say(d, LIB[d.si].n, '9.5px Inter, sans-serif', hit ? '#ff6b6b' : 'rgba(200,210,225,0.72)'); b--; } }
}

// ------------------------------------------------------------------- mouse
function pick(sx, sy) { const [wx, wy] = toW(sx, sy); let best = null, bd = 1e9; const reach = 6 / cam.k;
  for (const d of dots) { if (hits && !hits.has(d.si)) continue; const e = Math.hypot(d.x - wx, d.y - wy) - d.r; if (e < reach && e < bd) { bd = e; best = d; } } return best; }
let down = null;
cv.addEventListener('pointerdown', (e) => { down = { x: e.offsetX, y: e.offsetY, cam: { ...cam }, d: pick(e.offsetX, e.offsetY), moved: false }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', (e) => {
  if (down) { const dx = e.offsetX - down.x, dy = e.offsetY - down.y; if (Math.abs(dx) + Math.abs(dy) > 3) down.moved = true; if (!down.moved) return;
    cv.className = 'drag'; userMoved = true; fly = null; cam = { ...down.cam, x: down.cam.x - dx / cam.k, y: down.cam.y - dy / cam.k }; return; }
  const d = pick(e.offsetX, e.offsetY);
  if (d !== hover) { hover = d; clearTimeout(wantT); if (d) wantT = setTimeout(() => { if (hover === d && playing !== d.si) play(d.si); }, 80); showNow(); }
});
cv.addEventListener('pointerup', () => { const d = down; down = null; cv.className = ''; if (d && !d.moved) choose(d.d); });
cv.addEventListener('pointerleave', () => { hover = null; showNow(); });
cv.addEventListener('wheel', (e) => { e.preventDefault(); userMoved = true; fly = null; const [wx, wy] = toW(e.offsetX, e.offsetY);
  cam.k = Math.min(24, Math.max(0.2, cam.k * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)))); cam.x = wx - (e.offsetX - VW / 2) / cam.k; cam.y = wy - (e.offsetY - VH / 2) / cam.k; }, { passive: false });
function choose(d) { if (!d) { selected = null; $('card').classList.remove('on'); showNow(); return; } selected = d; card(d.si); play(d.si); }
function go(i) { const d = dots[i]; selected = d; card(i); play(i); const k = Math.max(cam.k, 3); fly = { from: { ...cam }, to: { x: d.x + 135 / k, y: d.y, k }, t0: performance.now() }; userMoved = true; }
function card(i) { const s = LIB[i];
  const chips = (l) => l.map((w) => `<span class="chip" data-f="${esc(w)}">${esc(w)}</span>`).join('') || '<span class="sub">—</span>';
  $('card').innerHTML = `<h3>${esc(s.n)}</h3><div class="where">${esc(s.k)}${s.k !== s.c ? ' · ' + esc(s.c) : ''}</div>
  <div class="row"><span>Heard as</span><div class="chips">${chips(s.h)}</div></div>
  <div class="row"><span>Sounds</span><div class="chips">${chips(s.w)}</div></div>
  <div class="row"><span>Length</span><span>${secs(s.s)}${s.nt ? ' · note ' + s.nt : ''} · ${esc(s.ki)}</span></div>
  <div class="sec">Sounds most like it — hover to hear, click to go</div>
  <div class="list">${KNN[i].map(([j]) => `<div data-i="${j}"><i style="background:${colourOf(LIB[j])}"></i><span class="nm">${esc(LIB[j].n)}</span><span class="sub">${secs(LIB[j].s)}</span></div>`).join('') || '<div class="sub">Not measured yet</div>'}</div>`;
  $('card').classList.add('on');
  $('card').querySelectorAll('.list div').forEach((el) => { const j = +el.dataset.i; el.onclick = () => go(j); el.onmouseenter = () => { hover = dots[j]; play(j); showNow(); }; el.onmouseleave = () => { hover = null; showNow(); }; });
  $('card').querySelectorAll('.chip').forEach((c) => c.onclick = () => { $('find').value = c.dataset.f; setFind(c.dataset.f); });
  showNow(); }
function setFind(q) { q = q.trim().toLowerCase(); if (!q) { hits = null; $('found').textContent = ''; return; } hits = new Set(LIB.filter((s) => s.text.includes(q)).map((s) => s.i)); $('found').textContent = `${hits.size} found`; }
$('find').addEventListener('input', (e) => setFind(e.target.value));
$('find').addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter' && hits && hits.size) go([...hits][0]); if (e.key === 'Escape') { e.target.value = ''; setFind(''); e.target.blur(); } });
function seg(id, attr, val) { document.querySelectorAll(`#${id} button`).forEach((b) => b.classList.toggle('on', b.dataset[attr] === val)); }
function setLayout(l) { layout = l; seg('lay', 'l', l); build(); }
function setTint(t) { tint = t; seg('tint', 't', t); keys(); if (selected) card(selected.si); }
function keys() {
  if (tint === 'family') { const c = {}; LIB.forEach((s) => c[s.f] = (c[s.f] || 0) + 1);
    $('keys').innerHTML = Object.entries(FAM).filter(([k]) => c[k]).map(([k, [n, h]]) => `<span><i style="background:${h}"></i>${n} ${c[k]}</span>`).join(''); }
  else { const st = tint === 'tone' ? TONE : LEN; $('keys').innerHTML = `<span>${tint === 'tone' ? 'dark' : 'short'}<i class="ramp" style="width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,${st.map((c) => `rgb(${c})`).join(',')})"></i>${tint === 'tone' ? 'bright' : 'long'}</span>`; } }
document.querySelectorAll('#lay button').forEach((b) => b.onclick = () => setLayout(b.dataset.l));
document.querySelectorAll('#tint button').forEach((b) => b.onclick = () => setTint(b.dataset.t));
document.querySelectorAll('#playMode button').forEach((b) => b.onclick = () => { playOn = b.dataset.p === 'on'; seg('playMode', 'p', b.dataset.p); if (!playOn) stop(); });
window.addEventListener('keydown', (e) => { if (e.target === $('find')) return;
  if (e.key === '/') { $('find').focus(); e.preventDefault(); }
  else if (e.key === 'Escape') { if (hits) { $('find').value = ''; setFind(''); } else if (selected) choose(null); else { userMoved = false; } }
  else if (e.key === ' ') { e.preventDefault(); playing >= 0 ? stop() : (selected && play(selected.si)); }
  else if (e.key === '1') setLayout('alike'); else if (e.key === '2') setLayout('islands'); });
$('status').textContent = `${N} sounds, each one a dot · hover plays through your engine on :8737`;

  const busy = jobs.some((j) => !j.t.done());
  if (busy) { for (const j of jobs) j.t.step(j.t.n > 300 ? 4 : 10); place(false); $('forming').textContent = `arranging by sound… ${Math.round(Math.min(...jobs.map((j) => j.t.progress())) * 100)}%`; }
  else $('forming').textContent = '';
  relax();
  if (!userMoved && !fly) fit();
  if (fly) { const t = Math.min(1, (now - fly.t0) / 600), e = t * t * (3 - 2 * t), lk = Math.log(fly.from.k) + (Math.log(fly.to.k) - Math.log(fly.from.k)) * e;
    cam = { x: fly.from.x + (fly.to.x - fly.from.x) * e, y: fly.from.y + (fly.to.y - fly.from.y) * e, k: Math.exp(lk) }; if (t >= 1) fly = null; }

}
resize(); window.addEventListener('resize', () => { resize(); });
setTint('family'); setLayout('alike'); requestAnimationFrame(frame);
</script></body></html>
