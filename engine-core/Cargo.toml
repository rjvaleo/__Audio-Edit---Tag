[package]
name = "engine-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The native app's engine core: the graph, cables, queues, clock and sound bank."

[features]
# Marks the audio thread while it renders, so a test's allocator can catch an
# allocation there. The production marker also selects the silent panic hook.
rt-check = []

# Validation only: run existing patch fixtures with the pool enabled.
pool-tests = []
